<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Interactive LPG Explorer</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>

        <div class="title">Interactive LPG Explorer — Supply Chain</div>

        <div class="legend">
            <div class="legend-title">Node types</div>
            <div class="legend-item"><span class="legend-swatch swatch-supplier"></span>Supplier</div>
            <div class="legend-item"><span class="legend-swatch swatch-product"></span>Product</div>
            <div class="legend-item"><span class="legend-swatch swatch-warehouse"></span>Warehouse</div>
            <div class="legend-item"><span class="legend-swatch swatch-order"></span>Order</div>
            <div class="legend-title" style="margin-top:6px;">Edge types</div>
            <div class="legend-item"><span class="legend-line line-supplies"></span>SUPPLIES</div>
            <div class="legend-item"><span class="legend-line line-stocks"></span>STOCKS</div>
            <div class="legend-item"><span class="legend-line line-fulfills"></span>FULFILLS</div>
        </div>

        <div class="right-panel">
            <div class="detail-panel" id="detail-panel">
                <div class="detail-title">Selection details</div>
                <div class="detail-body" id="detail-body">
                    Click any node or edge to inspect its label, type, and properties.
                </div>
            </div>
            <div class="controls">
                <button class="btn" id="reset-btn">Reset View</button>
            </div>
        </div>
    </div>

    <script src="lpg-explorer.js"></script>
</body>
</html>
