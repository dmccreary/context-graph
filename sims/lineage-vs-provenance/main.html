<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Lineage vs. Provenance</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>
        <div class="title">Lineage (where from) vs. Provenance (trust)</div>
        <div class="right-panel">
            <div class="detail-panel" id="dp">
                <div class="dt">Layer details</div>
                <div class="db" id="db">Click a node or toggle a layer to compare lineage and provenance.</div>
            </div>
            <button class="btn" id="lineage-btn">Hide Lineage</button>
            <button class="btn" id="prov-btn">Hide Provenance</button>
            <button class="btn" id="reset-btn">Reset View</button>
        </div>
    </div>
    <script src="lineage-vs-provenance.js"></script>
</body>
</html>
