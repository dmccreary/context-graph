<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Incumbent Gap Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <h1>Incumbent Systems vs. Context Graph Requirements</h1>
        <table class="grid">
            <thead>
                <tr>
                    <th class="row-header"></th>
                    <th class="col-header">Data Warehouse</th>
                    <th class="col-header">CRM System</th>
                    <th class="col-header">ERP System</th>
                    <th class="col-header">AI Agent Platform</th>
                    <th class="col-header purpose">Purpose-Built CG</th>
                </tr>
            </thead>
            <tbody id="grid-body"></tbody>
        </table>
        <div class="legend">
            <span class="sw red"></span> Cannot meet — structural constraint
            <span class="sw yellow"></span> Partial — significant integration tax
            <span class="sw green"></span> Native capability
        </div>
        <div class="detail" id="detail">Click any cell to read why it carries that rating.</div>
    </div>
    <script src="incumbent-gap-analysis.js"></script>
</body>
</html>
