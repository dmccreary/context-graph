<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>PageRank Supplier Graph</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>
        <div class="title">PageRank on a Supply Chain — node size ∝ score</div>
        <div class="right-panel">
            <div class="detail-panel" id="dp">
                <div class="dt">Node details</div>
                <div class="db" id="db">Click any node to see its PageRank score and supply-chain interpretation.</div>
            </div>
            <button class="btn" id="scores-btn">Show Scores</button>
            <button class="btn" id="critical-btn">Highlight Critical (&gt; 0.15)</button>
            <button class="btn" id="reset-btn">Reset View</button>
        </div>
    </div>
    <script src="pagerank-supplier-graph.js"></script>
</body>
</html>
