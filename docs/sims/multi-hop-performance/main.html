<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Multi-Hop Query Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: aliceblue; }
        .wrap { padding: 12px 16px 8px; background: white; border: 1px solid silver; }
        .title { font-size: 16px; font-weight: bold; color: #1a237e; margin-bottom: 6px; text-align: center; }
        .chart-box { position: relative; width: 100%; height: 380px; }
        .controls { margin-top: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .controls button {
            background: #3949ab; color: white; border: none; border-radius: 4px;
            padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: bold;
        }
        .controls button:hover { background: #283593; }
        .callout {
            background: #fff8e1; border: 1px solid #fbc02d; border-radius: 4px;
            padding: 6px 10px; font-size: 12px; color: #5d4037; flex: 1; min-width: 200px;
        }
        .scale-label { font-size: 12px; color: #455a64; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="title">Multi-Hop Query Performance: Native Graph vs Relational</div>
        <div class="chart-box"><canvas id="chart"></canvas></div>
        <div class="controls">
            <button id="scale-btn">Switch to Linear Scale</button>
            <span class="scale-label">Y-axis: <span id="scale-label">logarithmic</span></span>
            <div class="callout" id="callout">Click any hop's bar to see the relational/graph ratio.</div>
        </div>
    </div>
    <script src="multi-hop-performance.js"></script>
</body>
</html>
