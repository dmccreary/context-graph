<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Governance Framework Concept Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>
        <div class="title">Governance Framework — 25 Concepts</div>
        <div class="legend">
            <div class="li"><span class="sw" style="background:#5b7fbd"></span>Metadata types</div>
            <div class="li"><span class="sw" style="background:#2a9d8f"></span>Management approaches</div>
            <div class="li"><span class="sw" style="background:#e9c46a"></span>Quality dimensions</div>
            <div class="li"><span class="sw" style="background:#3949ab"></span>Governance structure</div>
            <div class="li"><span class="sw" style="background:#e76f51"></span>Access & protection</div>
        </div>
        <div class="right-panel">
            <div class="detail-panel" id="dp">
                <div class="dt">Concept details</div>
                <div class="db" id="db">Click any concept to see its definition and connected neighbors.</div>
            </div>
            <button class="btn" id="reset-btn">Reset View</button>
        </div>
    </div>
    <script src="governance-concept-map.js"></script>
</body>
</html>
